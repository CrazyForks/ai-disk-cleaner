name: PR Checks and Windows Build

on:
  pull_request:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  frontend-check:
    name: Frontend check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out pull request
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend checks
        run: pnpm check

  go-format:
    name: Go format check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check Go formatting
        shell: bash
        run: |
          mapfile -d '' go_files < <(git ls-files -z -- '*.go')
          if ((${#go_files[@]} == 0)); then
            exit 0
          fi

          unformatted="$(gofmt -l "${go_files[@]}")"
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

  windows-build:
    name: Build Windows artifact
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/build'
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number,
            });

            const association = context.payload.comment.author_association;
            const trustedAssociations = new Set([
              'OWNER',
              'MEMBER',
              'COLLABORATOR',
            ]);
            const isPullRequestAuthor =
              context.actor.toLowerCase() === pr.user.login.toLowerCase();

            if (!isPullRequestAuthor && !trustedAssociations.has(association)) {
              core.setFailed(
                'Only the pull request author or a repository collaborator may request a build.',
              );
              return;
            }

            if (!pr.head.repo) {
              core.setFailed('The pull request head repository is no longer available.');
              return;
            }

            core.setOutput('repository', pr.head.repo.full_name);
            core.setOutput('sha', pr.head.sha);
            core.setOutput('short_sha', pr.head.sha.slice(0, 7));

      - name: Check out pull request head
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.pr.outputs.repository }}
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build Windows application
        shell: pwsh
        run: |
          $artifactName = "ai-disk-cleaner-${{ steps.pr.outputs.short_sha }}"
          wails build -platform windows/amd64 -o "$artifactName.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-disk-cleaner-${{ steps.pr.outputs.short_sha }}
          path: build/bin/ai-disk-cleaner-${{ steps.pr.outputs.short_sha }}.exe
          if-no-files-found: error
